name: Auto Update Playlist

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-sync]
  schedule:
    # ตั้งเวลาให้รันทุกวันเวลา 12:00 น. ตามเวลาประเทศไทย (แปลงเป็น UTC คือ 05:00 น.)
    - cron: "0 5 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run playlist generator
        run: |
          python update_playlist.py

      - name: Commit and push if changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stalker_playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist [skip ci]" && git push)
